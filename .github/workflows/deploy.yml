name: Build and Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: pip install requests beautifulsoup4 curl_cffi pillow

      - name: Executar script de extração e build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python build.py

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Preparar deploy prebuilt
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Criar estrutura .vercel/output para deploy prebuilt (ficheiros estáticos + serverless functions)
          mkdir -p .vercel/output/static
          cp -r dist/* .vercel/output/static/

          # Criar Serverless Function para o motor de legendas PT-PT (/api/subtitles)
          mkdir -p .vercel/output/functions/api/subtitles.func
          cp api/subtitles.js .vercel/output/functions/api/subtitles.func/index.js
          cat > .vercel/output/functions/api/subtitles.func/.vc-config.json << 'EOF'
          {
            "runtime": "nodejs20.x",
            "handler": "index.js",
            "launcherType": "Nodejs",
            "shouldAddHelpers": true
          }
          EOF

          # Config que garante ficheiros estáticos e roteamento de legendas sem framework detection
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              {
                "src": "^/(?:c/[^/]+/)?subtitles/([^/]+)/([^/]+)/(.+?)(?:\\.json)?$",
                "dest": "/api/subtitles?type=$1&id=$2&extra=$3"
              },
              {
                "src": "^/(?:c/[^/]+/)?subtitles/([^/]+)/([^/]+?)(?:\\.json)?$",
                "dest": "/api/subtitles?type=$1&id=$2"
              },
              {
                "src": "^/c/[^/]+/catalog/(.*)$",
                "dest": "/catalog/$1"
              },
              {
                "src": "^/c/[^/]+/posters/(.*)$",
                "dest": "/posters/$1"
              },
              {
                "src": "^/c/[^/]+/logo.png$",
                "dest": "/logo.png"
              },
              {
                "src": "^/c/[^/]+/configure$",
                "dest": "/index.html"
              },
              {
                "src": "^/c/[^/]+/?$",
                "dest": "/index.html"
              },
              {
                "src": "^/configure/?$",
                "dest": "/index.html"
              },
              {
                "src": "/(.*)",
                "headers": {
                  "Access-Control-Allow-Origin": "*",
                  "Access-Control-Allow-Methods": "GET, HEAD, OPTIONS"
                },
                "continue": true
              }
            ]
          }
          EOF

          # Project link
          mkdir -p .vercel
          echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > .vercel/project.json

      - name: Publicar para Produção (prebuilt)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN
