name: Build and Deploy to Vercel

on:
  schedule:
    # Executa de 2 em 2 dias às 12:30 UTC (economiza quota da ScraperAPI < 1.000 créditos/mês)
    - cron: '30 12 */2 * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Executar script de extração e build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          SCRAPINGANT_PROXY_TYPE: ${{ secrets.SCRAPINGANT_PROXY_TYPE }}
        run: python build.py

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Preparar deploy prebuilt
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Criar estrutura .vercel/output para deploy prebuilt (ficheiros estáticos puros)
          mkdir -p .vercel/output/static
          cp -r dist/* .vercel/output/static/

          # Config que garante ficheiros estáticos sem framework detection e com caching optimizado
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              {
                "src": "^/c/[^/]+/catalog/(.*)$",
                "dest": "/catalog/$1"
              },
              {
                "src": "^/c/[^/]+/posters/(.*)$",
                "dest": "/posters/$1"
              },
              {
                "src": "^/c/[^/]+/logo.png$",
                "dest": "/logo.png"
              },
              {
                "src": "^/c/[^/]+/style\\.css$",
                "dest": "/style.css"
              },
              {
                "src": "^/c/[^/]+/configure$",
                "dest": "/index.html"
              },
              {
                "src": "^/c/[^/]+/?$",
                "dest": "/index.html"
              },
              {
                "src": "^/configure/?$",
                "dest": "/index.html"
              },
              {
                "src": "^/(?:c/[^/]+/)?posters/.*$",
                "headers": {
                  "Access-Control-Allow-Origin": "*",
                  "Access-Control-Allow-Methods": "GET, HEAD, OPTIONS",
                  "Cache-Control": "public, max-age=3600, s-maxage=86400, stale-while-revalidate=86400"
                },
                "continue": true
              },
              {
                "src": "^/(?:c/[^/]+/)?catalog/.*$",
                "headers": {
                  "Access-Control-Allow-Origin": "*",
                  "Access-Control-Allow-Methods": "GET, HEAD, OPTIONS",
                  "Cache-Control": "public, max-age=1800, s-maxage=86400, stale-while-revalidate=86400"
                },
                "continue": true
              },
              {
                "src": ".*manifest\\.json$",
                "headers": {
                  "Access-Control-Allow-Origin": "*",
                  "Access-Control-Allow-Methods": "GET, HEAD, OPTIONS",
                  "Cache-Control": "public, max-age=1800, s-maxage=86400, stale-while-revalidate=86400"
                },
                "continue": true
              },
              {
                "src": "/(.*)",
                "headers": {
                  "Access-Control-Allow-Origin": "*",
                  "Access-Control-Allow-Methods": "GET, HEAD, OPTIONS",
                  "Cache-Control": "public, max-age=1800, s-maxage=86400, stale-while-revalidate=86400"
                },
                "continue": true
              }
            ]
          }
          EOF

          # Project link
          mkdir -p .vercel
          echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > .vercel/project.json

      - name: Publicar para Produção (prebuilt)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN
